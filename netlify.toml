[build]
  publish = "public"
  command = "npm install"

[functions]
  directory = "netlify/functions"

# Camera needs HTTPS (Netlify provides it). Allow the camera on this site only.
[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(self)"
    X-Content-Type-Options = "nosniff"
